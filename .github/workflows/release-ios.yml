name: Release iOS SDL2

'on':
  push:
    tags:
      - 'v*-ios-*'
    branches:
      - 'codex/feature-ios-macos-releases'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.0-test.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build iPhone IPA and publish
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: false

      - name: Select Xcode and reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          sudo rm -rf \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.app \
            "$HOME/Library/Developer/CoreSimulator"
          df -h "$GITHUB_WORKSPACE"

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REPOSITORY_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
        run: |
          set -euo pipefail
          publish=true
          if [[ "$EVENT_NAME" == 'push' && "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$REF_NAME"
            [[ "$release_tag" == *-* ]] && is_prerelease=true || is_prerelease=false
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            release_tag="${INPUT_RELEASE_TAG//[[:space:]]/}"
            is_prerelease="$INPUT_PRERELEASE"
          else
            release_tag="v0.0.0-ci.${GITHUB_RUN_NUMBER}"
            is_prerelease=true
            publish=false
          fi
          bundle_identifier="${REPOSITORY_BUNDLE_IDENTIFIER:-com.lightwinder.yosuganosora.hdremake}"
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          version_source="${release_tag#v}"
          if [[ "$version_source" =~ ^([0-9]+)(\.([0-9]+))?(\.([0-9]+))?($|[^0-9.]) ]]; then
            version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[3]:-0}.${BASH_REMATCH[5]:-0}"
          else
            echo "The release tag must start with a numeric iOS version: $release_tag" >&2
            exit 1
          fi
          if [[ ! "$bundle_identifier" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "Invalid iOS bundle identifier: $bundle_identifier" >&2
            exit 1
          fi
          {
            echo "tag=$release_tag"
            echo "version-name=$version_name"
            echo "version-code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
            echo "bundle-identifier=$bundle_identifier"
            echo "prerelease=$is_prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Git LFS content
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          git lfs fsck

      - name: Generate complete content manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_content_manifest.py \
            --root data \
            --output data/content-manifest.json \
            --config content-packs.json \
            --cache "$RUNNER_TEMP/content-manifest-cache.json" \
            --full

      - name: Configure optional Apple signing
        id: signing
        shell: bash
        env:
          BUNDLE_IDENTIFIER: ${{ steps.release.outputs.bundle-identifier }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          provided=0
          for value in "$CERTIFICATE_BASE64" "$CERTIFICATE_PASSWORD" \
            "$PROVISIONING_PROFILE_BASE64" "$DEVELOPMENT_TEAM"; do
            [[ -n "$value" ]] && provided=$((provided + 1))
          done

          if [[ "$provided" -eq 0 ]]; then
            echo 'No Apple signing secrets were provided; building an unsigned IPA.'
            {
              echo 'IOS_CODE_SIGN_IDENTITY='
              echo 'IOS_DEVELOPMENT_TEAM='
              echo 'IOS_PROVISIONING_PROFILE='
              echo 'IOS_SIGNING_MODE=unsigned'
              echo 'signed=false'
              echo 'keychain='
            } >> "$GITHUB_ENV"
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$provided" -ne 4 ]]; then
            echo 'Configure all four iOS signing secrets or none of them.' >&2
            exit 1
          fi

          certificate="$RUNNER_TEMP/ios-distribution.p12"
          profile="$RUNNER_TEMP/ios.mobileprovision"
          profile_plist="$RUNNER_TEMP/ios-profile.plist"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$profile_plist"

          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
          application_identifier=$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' "$profile_plist")
          profile_bundle_identifier="${application_identifier#*.}"
          profile_matches=false
          if [[ "$profile_bundle_identifier" == "$BUNDLE_IDENTIFIER" || \
            "$profile_bundle_identifier" == '*' ]]; then
            profile_matches=true
          elif [[ "$profile_bundle_identifier" == *\* ]]; then
            profile_prefix="${profile_bundle_identifier%\*}"
            if [[ "$BUNDLE_IDENTIFIER" == "$profile_prefix"* && \
              "$BUNDLE_IDENTIFIER" != "$profile_prefix" ]]; then
              profile_matches=true
            fi
          fi
          if [[ "$profile_matches" != 'true' ]]; then
            echo "Provisioning profile does not match $BUNDLE_IDENTIFIER." >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | \
            sed -n '1s/.*"\(.*\)".*/\1/p')
          if [[ -z "$identity" ]]; then
            echo 'No usable code-signing identity was imported.' >&2
            exit 1
          fi

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$profile" "$profiles/$profile_uuid.mobileprovision"
          {
            echo "IOS_CODE_SIGN_IDENTITY=$identity"
            echo "IOS_DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM"
            echo "IOS_PROVISIONING_PROFILE=$profile_name"
            echo 'IOS_SIGNING_MODE=distribution'
          } >> "$GITHUB_ENV"
          {
            echo 'signed=true'
            echo "keychain=$keychain"
          } >> "$GITHUB_OUTPUT"

      - name: Generate iOS app icon from the shared PNG
        shell: bash
        run: |
          set -euo pipefail
          # 图标.ico is a 256x256 PNG; regenerate every AppIcon size from it.
          SRC="$GITHUB_WORKSPACE/图标.ico"
          WD="$RUNNER_TEMP/appicon"
          mkdir -p "$WD"
          cp "$SRC" "$WD/src.png"
          ICONSET="src/resources/ios/Images.xcassets/AppIcon.appiconset"
          gen() {
            # gen <w> <h> <out>
            sips -z "$2" "$1" "$WD/src.png" --out "$WD/out.png" >/dev/null 2>&1
            cp "$WD/out.png" "$ICONSET/$3"
          }
          gen 20 20 Icon-App-20x20@1x.png
          gen 40 40 Icon-App-20x20@2x.png
          gen 60 60 Icon-App-20x20@3x.png
          gen 29 29 Icon-App-29x29@1x.png
          gen 58 58 Icon-App-29x29@2x.png
          gen 87 87 Icon-App-29x29@3x.png
          gen 40 40 Icon-App-40x40@1x.png
          gen 80 80 Icon-App-40x40@2x.png
          gen 120 120 Icon-App-40x40@3x.png
          gen 57 57 Icon-App-57x57@1x.png
          gen 114 114 Icon-App-57x57@2x.png
          gen 120 120 Icon-App-60x60@2x.png
          gen 180 180 Icon-App-60x60@3x.png
          gen 72 72 Icon-App-72x72@1x.png
          gen 144 144 Icon-App-72x72@2x.png
          gen 76 76 Icon-App-76x76@1x.png
          gen 152 152 Icon-App-76x76@2x.png
          gen 167 167 Icon-App-83.5x83.5@2x.png
          gen 50 50 Icon-Small-50x50@1x.png
          gen 100 100 Icon-Small-50x50@2x.png
          gen 1024 1024 Icon-AppStore.png

      - name: Generate iOS Xcode project
        shell: bash
        env:
          IOS_VERSION_NAME: ${{ steps.release.outputs.version-name }}
          IOS_BUILD_NUMBER: ${{ steps.release.outputs.version-code }}
          IOS_BUNDLE_IDENTIFIER: ${{ steps.release.outputs.bundle-identifier }}
        run: |
          set -euo pipefail
          ./ios-project/generate.sh

      - name: Restore cached Xcode derived data
        id: ios-dd-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-derived-data
          key: ios-deriveddata-${{ github.sha }}

      - name: Build optimized iPhone application
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          args=(
            -project build/ios/krkrsdl2.xcodeproj
            -scheme krkrsdl2
            -configuration Release
            -sdk iphoneos
            -destination 'generic/platform=iOS'
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data"
            -parallelizeTargets
          )
          if [[ "$SIGNED" == 'true' ]]; then
            args+=(
              CODE_SIGN_STYLE=Manual
              "DEVELOPMENT_TEAM=$IOS_DEVELOPMENT_TEAM"
              "CODE_SIGN_IDENTITY=$IOS_CODE_SIGN_IDENTITY"
              "PROVISIONING_PROFILE_SPECIFIER=$IOS_PROVISIONING_PROFILE"
            )
          else
            args+=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild "${args[@]}" build

      - name: Save cached Xcode derived data
        if: steps.ios-dd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ios-derived-data
          key: ios-deriveddata-${{ github.sha }}

      - name: Verify application and create IPA
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION_NAME: ${{ steps.release.outputs.version-name }}
          VERSION_CODE: ${{ steps.release.outputs.version-code }}
          BUNDLE_IDENTIFIER: ${{ steps.release.outputs.bundle-identifier }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          app=$(find build/ios "$RUNNER_TEMP/ios-derived-data" -maxdepth 8 \
            -type d -name 'YosugaNoSoraHD.app' -path '*Release-iphoneos*' \
            -print -quit)
          executable="$app/YosugaNoSoraHD"
          if [[ -z "$app" || ! -x "$executable" || ! -f "$app/data/startup.tjs" ]]; then
            echo 'The iOS application bundle is incomplete.' >&2
            exit 1
          fi
          file "$executable" | grep -q 'arm64'
          [[ "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" == \
            "$BUNDLE_IDENTIFIER" ]]
          [[ "$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")" == \
            "$VERSION_NAME" ]]
          [[ "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" == \
            "$VERSION_CODE" ]]
          if [[ "$SIGNED" == 'true' ]]; then
            [[ -f "$app/embedded.mobileprovision" ]]
            codesign --verify --deep --strict --verbose=2 "$app"
          fi

          package="$RUNNER_TEMP/ios-package"
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$package/Payload" "$asset_dir"
          mv "$app" "$package/Payload/YosugaNoSoraHD.app"
          ipa_name="Yosuga-no-Sora-HD-Remake-iOS-arm64-$RELEASE_TAG.ipa"
          ipa="$RUNNER_TEMP/$ipa_name"
          (
            cd "$package"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa"
          )
          unzip -tq "$ipa"
          ipa_contents="$RUNNER_TEMP/ios-ipa-contents.txt"
          unzip -Z1 "$ipa" > "$ipa_contents"
          grep -Fx 'Payload/YosugaNoSoraHD.app/data/startup.tjs' \
            "$ipa_contents" >/dev/null

          rm -rf build/ios data "$package" "$RUNNER_TEMP/ios-derived-data"
          seven_zip=$(command -v 7zz || command -v 7z)
          "$seven_zip" a -t7z -mx=0 -mmt=on -v1900m \
            "$asset_dir/$ipa_name.7z" "$ipa"
          shopt -s nullglob
          volumes=("$asset_dir/$ipa_name.7z."*)
          [[ "${#volumes[@]}" -gt 0 ]]
          "$seven_zip" t "${volumes[0]}"
          for volume in "${volumes[@]}"; do
            [[ "$(stat -f '%z' "$volume")" -lt 2147483648 ]]
          done
          cat > "$asset_dir/$ipa_name-BUILD-INFO.txt" <<EOF
          Yosuga no Sora: HD Remake
          Runtime: Kirikiri SDL2 for iOS (arm64)
          Release: $RELEASE_TAG
          Commit: $GITHUB_SHA
          Signing: $IOS_SIGNING_MODE
          Native optimization: Release
          EOF
          echo "asset-directory=$asset_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$asset_dir"

      - name: Create or update GitHub Release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          ASSET_DIRECTORY: ${{ steps.package.outputs.asset-directory }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("$ASSET_DIRECTORY"/*)
          [[ "${#assets[@]}" -gt 0 ]]
          exists=false
          is_draft=false
          if json=$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" \
            --json isDraft 2>/dev/null); then
            exists=true
            is_draft=$(python3 -c \
              'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' \
              <<<"$json")
          else
            args=(release create "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft \
              --title "$RELEASE_TAG" --generate-notes)
            [[ "$EVENT_NAME" == 'push' ]] && args+=(--verify-tag) || args+=(--target "$COMMIT_SHA")
            [[ "$IS_PRERELEASE" == 'true' ]] && args+=(--prerelease)
            if ! gh "${args[@]}"; then
              # gh cannot attach a release to an already existing tag; the
              # REST API can. Fall back to it before giving up.
              echo "gh release create failed; trying REST API fallback."
              api_args=(api "repos/$GH_REPOSITORY/releases" \
                -f "tag_name=$RELEASE_TAG" -f "target_commitish=$COMMIT_SHA" \
                -f draft=true -f "name=$RELEASE_TAG" -f generate_release_notes=true)
              [[ "$IS_PRERELEASE" == 'true' ]] && api_args+=(-f prerelease=true)
              gh "${api_args[@]}" || echo "REST API release creation also failed."
              for ((attempt = 1; attempt <= 12; attempt++)); do
                if json=$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" \
                  --json isDraft 2>/dev/null); then
                  exists=true
                  is_draft=$(python3 -c \
                    'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' \
                    <<<"$json")
                  break
                fi
                echo "Waiting for another workflow to create the release ($attempt/12)."
                sleep 5
              done
              [[ "$exists" == 'true' ]] || exit 1
            fi
          fi
          # Uploading the large IPA can fail transiently; retry a few times.
          uploaded=false
          for ((attempt = 1; attempt <= 5; attempt++)); do
            if gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GH_REPOSITORY" --clobber; then
              uploaded=true
              break
            fi
            echo "Release asset upload failed (attempt $attempt/5); retrying in 20s..."
            sleep 20
          done
          [[ "$uploaded" == 'true' ]] || exit 1
          if [[ "$exists" == 'false' || "$is_draft" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft=false
          fi

      - name: Upload non-release IPA artifact
        if: steps.release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Yosuga-no-Sora-HD-Remake-iOS-arm64-${{ steps.release.outputs.tag }}
          path: ${{ steps.package.outputs.asset-directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        shell: bash
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
