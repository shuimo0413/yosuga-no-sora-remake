name: Release OpenHarmony / HarmonyOS HAP

'on':
  push:
    tags:
      - 'v*-ohos-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.0-test.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        default: true
        type: boolean
      sign_mode:
        description: 'HAP signing: none / community / agc'
        required: true
        default: community
        type: choice
        options:
          - none
          - community
          - agc
      data_mode:
        description: 'external / bundled / mini'
        required: true
        default: external
        type: choice
        options:
          - external
          - bundled
          - mini

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-app:
    name: Build OpenHarmony HAP
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository, submodules, and LFS content
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: false
      - name: Patch krkrz for OHOS xp3 auto paths
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_krkrz_ohos.py
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/lib/android/sdk/build-tools /usr/local/lib/android/sdk/cmake \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/platforms \
            /usr/local/lib/android/sdk/system-images /usr/local/share/boost /usr/share/dotnet
          sudo apt-get clean
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_SIGN_MODE: ${{ inputs.sign_mode }}
          OHOS_DEFAULT_SIGN_MODE: ${{ vars.OHOS_DEFAULT_SIGN_MODE }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            release_tag="$REF_NAME"
            if [[ "$release_tag" == *-* ]]; then is_prerelease=true; else is_prerelease=false; fi
          else
            release_tag="${INPUT_RELEASE_TAG//[[:space:]]/}"
            is_prerelease="$INPUT_PRERELEASE"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $release_tag" >&2; exit 1
          fi
          version_name="${release_tag#v}"
          version_code="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          sign_mode="${INPUT_SIGN_MODE}"
          if [[ -z "$sign_mode" ]]; then sign_mode="${OHOS_DEFAULT_SIGN_MODE:-community}"; fi
          case "$sign_mode" in none|community|agc) ;; *) echo "Bad sign mode: $sign_mode" >&2; exit 1 ;; esac
          {
            echo "tag=$release_tag"
            echo "prerelease=$is_prerelease"
            echo "version-name=$version_name"
            echo "version-code=$version_code"
            echo "sign-mode=$sign_mode"
            echo "data-mode=${{ inputs.data_mode }}"
          } >> "$GITHUB_OUTPUT"
      # build-app does not need game data (external mode): NO git lfs pull,
      # no content/asset manifest generation. The app fetches data-assets.json
      # from the Release at runtime, so the HAP build never touches data/.
      - name: Restore cached OHOS SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ohos-sdk-cache
          key: ohos-sdk-${{ vars.OHOS_COMMAND_LINE_TOOLS_URL || '5.0.3' }}
      - name: Install the OpenHarmony 5.0 command line tools and SDK
        shell: bash
        env:
          OHOS_COMMAND_LINE_TOOLS_URL: ${{ vars.OHOS_COMMAND_LINE_TOOLS_URL }}
          CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/ohos-sdk"
          mkdir -p "$sdk_root"
          if [[ "$CACHE_HIT" == 'true' && -d "ohos-sdk-cache" ]]; then
            echo "Using cached OHOS SDK"
            cp -r ohos-sdk-cache/. "$sdk_root/"
            api_version="$(ls "$sdk_root" | xargs -n1 basename | grep -E '^[0-9]+$' | sort -rn | head -1)"
          else
            cli_url="${OHOS_COMMAND_LINE_TOOLS_URL:-https://repo.huaweicloud.com/harmonyos/ohpm/5.0.3/commandline-tools-linux-x64-5.0.3.906.zip}"
            echo "Downloading command line tools"
            curl -fL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/commandline-tools.zip" "$cli_url"
            unzip -q -o "$RUNNER_TEMP/commandline-tools.zip" -d "$sdk_root/"
            [[ -d "$sdk_root/command-line-tools" ]] || { echo 'command-line-tools missing' >&2; exit 1; }
            bundled_sdk="$sdk_root/command-line-tools/sdk/default/openharmony"
            [[ -d "$bundled_sdk/native" && -d "$bundled_sdk/ets" ]] || { echo 'SDK components missing' >&2; exit 1; }
            uni_json="$(find "$bundled_sdk" -maxdepth 2 -name oh-uni-package.json -print -quit)"
            api_version="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('apiVersion',''))" "$uni_json" 2>/dev/null || echo 12)"
            [[ -n "$api_version" ]] || api_version="12"
            mkdir -p "$sdk_root/$api_version"
            for component in ets js native previewer toolchains; do
              if [[ -d "$bundled_sdk/$component" ]]; then mv "$bundled_sdk/$component" "$sdk_root/$api_version/$component"; fi
            done
            rm -rf "$sdk_root/command-line-tools/sdk"
            rm -f "$RUNNER_TEMP/commandline-tools.zip"
          fi
          chmod +x "$sdk_root"/command-line-tools/bin/* 2>/dev/null || true
          [[ -x "$sdk_root/command-line-tools/bin/hvigorw" ]] || { echo 'hvigorw missing' >&2; exit 1; }
          [[ -n "$api_version" && -d "$sdk_root/$api_version/native" ]] || { echo 'native missing' >&2; exit 1; }
          echo "DEVECO_SDK_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "OHOS_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "OHOS_SDK_API=$api_version" >> "$GITHUB_ENV"
          ls "$sdk_root/$api_version"
      - name: Mirror SDK for cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ohos-sdk-cache
          cp -r "$RUNNER_TEMP/ohos-sdk" ohos-sdk-cache
      - name: Save cached OHOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ohos-sdk-cache
          key: ohos-sdk-${{ vars.OHOS_COMMAND_LINE_TOOLS_URL || '5.0.3' }}
      - name: Prepare the OpenHarmony project
        shell: bash
        env:
          DATA_MODE: ${{ steps.release.outputs.data-mode }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # external mode: the HAP does not bundle data and does not need a
          # bundled data-assets.json (the app fetches it from the Release at
          # runtime). Only mini/bundled (diagnostic) modes need LFS data.
          data_arg=""
          if [[ "$DATA_MODE" != 'external' ]]; then
            git lfs pull
            if [[ "$DATA_MODE" == 'bundled' ]]; then data_arg="--data-link"; fi
          fi
          python3 tools/setup_ohos_project.py $data_arg
          if [[ "$DATA_MODE" == 'mini' ]]; then
            rm -f ohos-project/entry/src/main/resources/rawfile/data
            mkdir -p ohos-project/entry/src/main/resources/rawfile/data
            cp data/startup.tjs ohos-project/entry/src/main/resources/rawfile/data/
            find data -maxdepth 1 -type f -size -5M -exec cp {} ohos-project/entry/src/main/resources/rawfile/data/ \;
          fi
      - name: Inject default manifest URL
        shell: bash
        env:
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Write the current repository's Release download root into the HAP
          # so forks/renames track the right repo without editing code.
          mkdir -p ohos-project/entry/src/main/resources/rawfile
          printf '{"baseUrl":"https://github.com/%s/releases/latest/download/","releaseTag":"%s"}\n' \
            "$REPO" "$RELEASE_TAG" \
            > ohos-project/entry/src/main/resources/rawfile/default-manifest.json
          cat ohos-project/entry/src/main/resources/rawfile/default-manifest.json
      - name: Build the release HAPs (harmonyos + openharmony flavors)
        id: build
        shell: bash
        env:
          OHOS_VERSION_NAME: ${{ steps.release.outputs.version-name }}
          OHOS_VERSION_CODE: ${{ steps.release.outputs.version-code }}
        run: |
          set -euo pipefail
          export PATH="$DEVECO_SDK_HOME/command-line-tools/bin:$PATH"
          cd ohos-project
          { echo "sdk.dir=$DEVECO_SDK_HOME"; } > local.properties
          export OHOS_BASE_SDK_HOME="$DEVECO_SDK_HOME"
          hvigorw --version
          python3 - <<'PY'
          import os, re
          path = 'AppScope/app.json5'
          text = open(path, encoding='utf-8').read()
          text = re.sub(r'"(versionName)"\s*:\s*"[^"]*"', '"versionName": "' + os.environ['OHOS_VERSION_NAME'] + '"', text)
          text = re.sub(r'"(versionCode)"\s*:\s*\d+', '"versionCode": ' + os.environ['OHOS_VERSION_CODE'], text)
          open(path, 'w', encoding='utf-8').write(text)
          path = 'build-profile.json5'
          text = open(path, encoding='utf-8').read()
          api = os.environ.get('OHOS_SDK_API', '12')
          for field in ('compileSdkVersion', 'compatibleSdkVersion', 'targetSdkVersion'):
              text = re.sub(r'("' + field + r'"\s*:\s*)[^,\n]+', r'\g<1>' + api, text)
          open(path, 'w', encoding='utf-8').write(text)
          PY
          # The ArkTS shell reads entry/src/main/resources/rawfile/build-flavor.json
          # to pick the Download-directory route at runtime:
          #   harmonyos   -> save(DOWNLOAD) route (silent Download/<bundleName>)
          #   openharmony -> experimental routes (folder picker / permission)
          for flavor in harmonyos openharmony; do
            printf '{"flavor":"%s"}\n' "$flavor" \
              > entry/src/main/resources/rawfile/build-flavor.json
            cat entry/src/main/resources/rawfile/build-flavor.json
            hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon
            hap="$(find entry/build -name 'entry-default-*.hap' -print -quit)"
            [[ -n "$hap" && -f "$hap" ]] || { echo "No HAP produced for $flavor" >&2; exit 1; }
            mv "$hap" "$RUNNER_TEMP/hap-$flavor.hap"
            rm -rf entry/build # keep entry/.cxx so the second flavor reuses the native build
          done
          ls -lh "$RUNNER_TEMP"/hap-*.hap
          echo "hap-harmonyos=$RUNNER_TEMP/hap-harmonyos.hap" >> "$GITHUB_OUTPUT"
          echo "hap-openharmony=$RUNNER_TEMP/hap-openharmony.hap" >> "$GITHUB_OUTPUT"

      - name: Sign the HAPs
        id: signing
        if: steps.release.outputs.sign-mode != 'none'
        shell: bash
        env:
          HAP_HARMONYOS: ${{ steps.build.outputs.hap-harmonyos }}
          HAP_OPENHARMONY: ${{ steps.build.outputs.hap-openharmony }}
          SIGN_MODE: ${{ steps.release.outputs.sign-mode }}
          KEYSTORE_BASE64: ${{ secrets.OHOS_KEYSTORE_P12_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          APP_CERT_BASE64: ${{ secrets.OHOS_APP_CERT_BASE64 }}
          PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_P7B_BASE64 }}
          OHOS_SIGN_TOOL_URL: ${{ vars.OHOS_SIGN_TOOL_URL }}
        run: |
          set -euo pipefail
          values=("$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$APP_CERT_BASE64" "$PROFILE_BASE64")
          configured=0
          for value in "${values[@]}"; do [[ -n "$value" ]] && configured=$((configured + 1)); done
          sign_tool=""
          mapfile -t candidate_tools < <(find "$OHOS_SDK_ROOT" -name 'hap-sign-tool*.jar' -print 2>/dev/null || true)
          if [[ "${#candidate_tools[@]}" -gt 0 ]]; then
            sign_tool="${candidate_tools[0]}"
          else
            sign_tool="$RUNNER_TEMP/hap-sign-tool.jar"
            curl -fL --retry 3 --retry-delay 10 -o "$sign_tool" "${OHOS_SIGN_TOOL_URL:-https://repo.huaweicloud.com/harmonyos/develop_tools/hapsigntoolv2.jar}"
          fi
          [[ -f "$sign_tool" ]] || { echo 'Signing tool missing' >&2; exit 1; }
          if [[ "$SIGN_MODE" == 'agc' ]]; then
            [[ "$configured" -eq 6 ]] || { echo 'agc mode needs all six secrets' >&2; exit 1; }
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.p12"
            printf '%s' "$APP_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.cer"
            printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.p7b"
            for hap in "$HAP_HARMONYOS" "$HAP_OPENHARMONY"; do
              base="$(basename "$hap" .hap)"
              signed="$RUNNER_TEMP/$base-signed.hap"
              java -jar "$sign_tool" sign-app -keyAlias "$KEY_ALIAS" -signAlg SHA256withECDSA -mode localSign \
                -appCertFile "$RUNNER_TEMP/cert.cer" -profileFile "$RUNNER_TEMP/profile.p7b" \
                -inFile "$hap" -outFile "$signed" -keystoreFile "$RUNNER_TEMP/keystore.p12" \
                -keyPwd "$KEY_PASSWORD" -keystorePwd "$KEYSTORE_PASSWORD"
            done
            echo 'signed=agc' >> "$GITHUB_OUTPUT"
          elif [[ "$SIGN_MODE" == 'community' ]]; then
            echo 'Signing with the community OpenHarmony debug certificate.'
            sign_dir="$RUNNER_TEMP/ohos-autosign"; mkdir -p "$sign_dir"
            cp "$sign_tool" "$sign_dir/hap-sign-tool.jar"
            for file in autosign.py createRootAndSubCert.config createAppCertAndProfile.config signHap.config UnsgnedReleasedProfileTemplate.json; do
              curl -fL --retry 3 --retry-delay 10 -o "$sign_dir/$file" "https://raw.githubusercontent.com/openharmony/developtools_hapsigner/master/autosign/$file"
            done
            cd "$sign_dir"
            sed -i "s#config.signtool=.*#config.signtool=$sign_dir/hap-sign-tool.jar#" *.config
            now="$(date +%s)"; future="$(date -d '+10 years' +%s)"
            jq --arg now "$now" --arg future "$future" '.validity = {"not-before": ($now|tonumber), "not-after": ($future|tonumber)} | .["bundle-info"]["bundle-name"]="com.lightwinder.yosuganosora.hdremake" | .["bundle-info"]["app-feature"]="hos_normal_app"' UnsgnedReleasedProfileTemplate.json > profile.tmp.json
            mv profile.tmp.json UnsgnedReleasedProfileTemplate.json
            sed -i 's#common.keystoreFile=.*#common.keystoreFile=ohtest.p12#' createRootAndSubCert.config
            sed -i 's#common.keystoreFile=.*#common.keystoreFile=ohtest.p12#' createAppCertAndProfile.config
            sed -i 's#sub-ca.app.keyAlias=.*#sub-ca.app.keyAlias=oh-app-sign-srv-ca-key-v1#' createAppCertAndProfile.config
            sed -i 's#sub-ca.app.subject=.*#sub-ca.app.subject=C=CN,O=OpenHarmony,OU=OpenHarmony Community,CN= Application Signature Service CA#' createAppCertAndProfile.config
            sed -i 's#sub-ca.app.outFile=.*#sub-ca.app.outFile=app-sign-srv-ca1.cer#' createAppCertAndProfile.config
            sed -i 's#root-ca.outFile=.*#root-ca.outFile=root-ca1.cer#' createAppCertAndProfile.config
            sed -i 's#profile.keypair.keyAlias=.*#profile.keypair.keyAlias=oh-profile-key-v1#' createAppCertAndProfile.config
            sed -i 's#cert.profile.outFile=.*#cert.profile.outFile=profile1.pem#' createAppCertAndProfile.config
            sed -i 's#common.keystoreFile=.*#common.keystoreFile=ohtest.p12#' signHap.config
            run_autosign() { python3 autosign.py "$1" || { cat error.txt 2>/dev/null || true; cat log.txt 2>/dev/null || true; exit 1; }; }
            run_autosign createRootAndSubCert
            run_autosign createAppCertAndProfile
            for hap in "$HAP_HARMONYOS" "$HAP_OPENHARMONY"; do
              base="$(basename "$hap" .hap)"
              cp "$hap" "$sign_dir/app1-unsigned.hap"
              sed -i "s#sign.app.outFile=.*#sign.app.outFile=app1-signed.hap#" signHap.config
              run_autosign signHap
              signed="$sign_dir/result/app1-signed.hap"
              [[ -f "$signed" ]] || { echo 'Community signing failed' >&2; exit 1; }
              cp "$signed" "$RUNNER_TEMP/$base-signed.hap"
            done
            echo 'signed=community' >> "$GITHUB_OUTPUT"
          else
            echo "Bad sign mode: $SIGN_MODE" >&2; exit 1
          fi
          echo "signed-harmonyos=$RUNNER_TEMP/hap-harmonyos-signed.hap" >> "$GITHUB_OUTPUT"
          echo "signed-openharmony=$RUNNER_TEMP/hap-openharmony-signed.hap" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP"/hap-*-signed.hap

      - name: Verify and package the HAPs
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          HAP_HARMONYOS: ${{ steps.build.outputs.hap-harmonyos }}
          HAP_OPENHARMONY: ${{ steps.build.outputs.hap-openharmony }}
          SIGNED_HARMONYOS: ${{ steps.signing.outputs.signed-harmonyos }}
          SIGNED_OPENHARMONY: ${{ steps.signing.outputs.signed-openharmony }}
          DATA_MODE: ${{ steps.release.outputs.data-mode }}
        run: |
          set -euo pipefail
          if [[ "$DATA_MODE" == 'bundled' ]]; then
            required_list=('libs/arm64-v8a/libentry.so' 'libs/arm64-v8a/libkrkrsdl2.so' 'libs/x86_64/libentry.so' 'libs/x86_64/libkrkrsdl2.so' 'resources/rawfile/data/startup.tjs')
          else
            required_list=('libs/arm64-v8a/libentry.so' 'libs/arm64-v8a/libkrkrsdl2.so' 'libs/x86_64/libentry.so' 'libs/x86_64/libkrkrsdl2.so')
          fi
          if [[ "$DATA_MODE" == 'mini' ]]; then data_suffix="-mini"; else data_suffix=""; fi
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          verify_and_package() {
            local flavor="$1" hap="$2" signed_hap="$3"
            local file="$hap"
            [[ -n "$signed_hap" && -f "$signed_hap" ]] && file="$signed_hap"
            [[ -f "$file" ]] || { echo "HAP missing for $flavor" >&2; exit 1; }
            unzip -t "$file" >/dev/null
            mapfile -t contents < <(unzip -Z1 "$file")
            content_list="$(printf '%s\n' "${contents[@]}")"
            for required in "${required_list[@]}"; do
              grep -Fxq "$required" <<<"$content_list" || { echo "$flavor HAP missing $required" >&2; exit 1; }
            done
            local os_label="OpenHarmony"
            [[ "$flavor" == 'harmonyos' ]] && os_label="HarmonyOS"
            local package_name
            if [[ -n "$signed_hap" ]]; then
              package_name="Yosuga-no-Sora-HD-Remake-${os_label}-arm64-x86_64${data_suffix}-$RELEASE_TAG.hap"
            else
              package_name="Yosuga-no-Sora-HD-Remake-${os_label}-arm64-x86_64${data_suffix}-unsigned-$RELEASE_TAG.hap"
            fi
            cp "$file" "$asset_dir/$package_name"
            printf 'Yosuga no Sora: HD Remake\nRuntime: Kirikiri SDL2 for %s 5.0 (API 12, ARM64 + x86_64)\nFlavor: %s\nRelease: %s\nCommit: %s\nSigning: %s\nData: %s\nNative optimization: Release\n' \
              "$os_label" "$flavor" "$RELEASE_TAG" "$GITHUB_SHA" "${signed_hap:-unsigned}" "${DATA_MODE:-external}" \
              > "$asset_dir/$package_name-BUILD-INFO.txt"
          }
          verify_and_package harmonyos "$HAP_HARMONYOS" "$SIGNED_HARMONYOS"
          verify_and_package openharmony "$HAP_OPENHARMONY" "$SIGNED_OPENHARMONY"
          rm -rf ohos-project/entry/build ohos-project/.hvigor ohos-project/entry/src/main/cpp/third_party
          echo "asset-directory=$asset_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$asset_dir"
      - name: Publish HAP to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          ASSET_DIR: ${{ steps.package.outputs.asset-directory }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" >/dev/null 2>&1; then
            args=(release create "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft --title "$RELEASE_TAG" --generate-notes)
            [[ "$EVENT_NAME" == 'push' ]] && args+=(--verify-tag) || args+=(--target "$COMMIT_SHA")
            gh "${args[@]}" || true
          fi
          assets=("$ASSET_DIR"/*)
          [[ "${#assets[@]}" -gt 0 ]] || { echo 'no hap assets' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPOSITORY" --clobber

          # Publish the release right here: the HAP is uploaded, so flip the
          # draft to published (prerelease flag per the trigger).
          if [[ "$EVENT_NAME" == 'push' ]]; then
            if [[ "$RELEASE_TAG" == *-* ]]; then IS_PRERELEASE=true; else IS_PRERELEASE=false; fi
          else
            IS_PRERELEASE="$INPUT_PRERELEASE"
          fi
          exists=false
          for ((attempt=1; attempt<=20; attempt++)); do
            if json=$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" --json isDraft 2>/dev/null); then
              exists=true; break
            fi
            echo "Waiting for release to be created ($attempt/20)."; sleep 5
          done
          [[ "$exists" == 'true' ]] || exit 1
          args=(--draft=false)
          [[ "$IS_PRERELEASE" == 'true' ]] && args+=(--prerelease)
          gh release edit "$RELEASE_TAG" "${args[@]}" --repo "$GH_REPOSITORY"


