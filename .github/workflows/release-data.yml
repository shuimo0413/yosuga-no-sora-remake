name: Release game data

# Packages and publishes the downloadable game data assets (multi-part
# zips + data-assets.json) as a STANDALONE workflow, shared by every
# platform build (OpenHarmony, Android, ...). The assets are named
# generically (no platform suffix); each zip stores its entries under the
# "data/" prefix so extracting all parts into the data folder reproduces
# the tree.

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.0-test.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-data:
    name: Package game data
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      release-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out repository, submodules, and LFS content
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            release_tag="$REF_NAME"
          else
            release_tag="${INPUT_RELEASE_TAG//[[:space:]]/}"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Verify Git LFS content
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          git lfs fsck
      # Version follows the release tag (shared with every platform):
      # stamped into status.tjs before the manifest, so the content
      # manifest records the hash of the file that actually ships.
      - name: Inject the game version into status.tjs
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/inject_game_version.py \
            --tag "$RELEASE_TAG" \
            --status data/system/status.tjs
      - name: Generate and validate the content manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_content_manifest.py \
            --root data \
            --output data/content-manifest.json \
            --config content-packs.json \
            --cache "$RUNNER_TEMP/content-manifest-cache.json" \
            --full
      - name: Package game data assets
        id: data
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/data-assets"
          mkdir -p "$out_dir"
          # The manifest baseUrl must point at THIS repository (not a fork),
          # so it is injected from the build context instead of being coded
          # in the tool.
          python3 tools/package_data_release.py \
            --root data --config content-packs.json \
            --tag "$RELEASE_TAG" \
            --base-url "https://github.com/$GH_REPOSITORY/releases/download" \
            --out "$out_dir"
          echo "assets-dir=$out_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$out_dir"
      - name: Publish data assets to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          DATA_DIR: ${{ steps.data.outputs.assets-dir }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The platform build usually creates the draft release first; wait
          # for it to exist, then upload the data assets onto it. If no
          # release exists yet, create a draft so manual dispatches still
          # work standalone.
          ok=0
          for ((attempt=1; attempt<=40; attempt++)); do
            if gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" >/dev/null 2>&1; then ok=1; break; fi
            sleep 10
          done
          if [[ "$ok" != '1' ]]; then
            args=(release create "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft --title "$RELEASE_TAG" --generate-notes)
            [[ "$IS_PRERELEASE" == 'true' ]] && args+=(--prerelease)
            gh "${args[@]}" || true
          fi
          up=("$DATA_DIR"/*.zip "$DATA_DIR"/data-assets.json)
          gh release upload "$RELEASE_TAG" "${up[@]}" --repo "$GH_REPOSITORY" --clobber
