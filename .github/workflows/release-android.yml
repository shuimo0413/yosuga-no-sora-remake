name: Release Android SDL2

'on':
  push:
    tags:
      - 'v*-android-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.0-test.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build ARM64 release and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository, submodules, and LFS content
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: false

      - name: Patch SDL for Android right/middle mouse buttons
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_sdl_android_mouse.py

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android/sdk/build-tools \
            /usr/local/lib/android/sdk/cmake \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/platforms \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/share/boost \
            /usr/share/dotnet
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-project/*.gradle
            android-project/app/*.gradle
            android-project/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Cache the Android SDK / NDK components so the multi-GB downloads
      # (platform-37, build-tools, cmake, ndk) are not repeated every run.
      # setup-android exports ANDROID_HOME, which cache uses as the path.
      - name: Restore cached Android SDK components
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/platforms/android-37
          key: android-sdk-components-37.0-36.0.0-3.22-ndk28.2

      - name: Install pinned Android SDK and NDK components
        shell: bash
        run: |
          set -euo pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;28.2.13676358'

      - name: Save cached Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/platforms/android-37
          key: android-sdk-components-37.0-36.0.0-3.22-ndk28.2

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            release_tag="$REF_NAME"
            if [[ "$release_tag" == *-* ]]; then
              is_prerelease=true
            else
              is_prerelease=false
            fi
          else
            release_tag="${INPUT_RELEASE_TAG//[[:space:]]/}"
            is_prerelease="$INPUT_PRERELEASE"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi

          version_name="${release_tag#v}"
          version_code="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          {
            echo "tag=$release_tag"
            echo "prerelease=$is_prerelease"
            echo "version-name=$version_name"
            echo "version-code=$version_code"
          } >> "$GITHUB_OUTPUT"


      # Restore the development signing keystore from the Actions cache so
      # every build (with or without release secrets) signs with the SAME
      # key.  Without this, the build falls back to the Android debug key
      # which is regenerated on every fresh runner, so installing a new APK
      # over an older one fails with "signatures do not match".
      - name: Restore development signing keystore
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/krkrsdl2-development.jks
          key: krkrsdl2-android-signing-v1
          restore-keys: |
            krkrsdl2-android-signing-

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_values=(
            "$KEYSTORE_BASE64"
            "$KEYSTORE_PASSWORD"
            "$KEY_ALIAS"
            "$KEY_PASSWORD"
          )
          configured=0
          for value in "${signing_values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done

          if [[ "$configured" -ne 0 && "$configured" -ne 4 ]]; then
            echo 'Android signing secrets are only partially configured.' >&2
            exit 1
          fi

          if [[ "$configured" -eq 4 ]]; then
            # Release signing secrets are present: use the production key.
            keystore="$RUNNER_TEMP/yosuga-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo 'mode=release' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Development mode: reuse the cached keystore so every CI build
          # signs identically (and matches whatever the user last installed).
          dev_keystore="$RUNNER_TEMP/krkrsdl2-development.jks"
          if [[ ! -f "$dev_keystore" ]]; then
            echo 'Generating a new development signing keystore (cached for future builds).'
            keytool -genkeypair -v \
              -keystore "$dev_keystore" \
              -storepass krkrsdl2-dev \
              -alias krkrsdl2 \
              -keypass krkrsdl2-dev \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Kirikiri SDL2 Development, OU=krkrsdl2, O=krkrsdl2, L=Internet, ST=Internet, C=US'
          fi
          chmod 600 "$dev_keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$dev_keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=krkrsdl2-dev"
            echo "ANDROID_KEY_ALIAS=krkrsdl2"
            echo "ANDROID_KEY_PASSWORD=krkrsdl2-dev"
          } >> "$GITHUB_ENV"
          echo 'mode=development' >> "$GITHUB_OUTPUT"

      # Persist the development keystore so later builds reuse the exact same
      # key.  save is only attempted when the restore missed; a save race on
      # the same key (e.g. parallel runs) must not fail the whole build.
      - name: Save development signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/krkrsdl2-development.jks
          key: krkrsdl2-android-signing-v1

      - name: Strip bundled game data from the APK
        shell: bash
        run: |
          set -euo pipefail
          # The game data is published separately by the release-data
          # workflow; the APK ships only the engine and the bootstrap UI.
          rm -rf android-project/app/src/main/assets/data

      - name: Build optimized ARM64 release APK
        working-directory: android-project
        shell: bash
        env:
          ORG_GRADLE_PROJECT_androidVersionName: ${{ steps.release.outputs.version-name }}
          ORG_GRADLE_PROJECT_androidVersionCode: ${{ steps.release.outputs.version-code }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -Parm64-v8a

      - name: Verify and package the APK
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          source_apk='android-project/app/build/outputs/apk/release/krkrsdl2_arm64-v8a.apk'
          if [[ ! -f "$source_apk" ]]; then
            echo "Release APK is missing: $source_apk" >&2
            exit 1
          fi

          package_name="Yosuga-no-Sora-HD-Remake-Android-arm64-$RELEASE_TAG.apk"
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          cp "$source_apk" "$asset_dir/$package_name"

          unzip -t "$asset_dir/$package_name"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$asset_dir/$package_name"
          package_info=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging \
            "$asset_dir/$package_name" | head -n 1)
          [[ "$package_info" == *"versionCode='${{ steps.release.outputs.version-code }}'"* ]]
          [[ "$package_info" == *"versionName='${{ steps.release.outputs.version-name }}'"* ]]
          mapfile -t packaged_abis < <(unzip -Z1 "$asset_dir/$package_name" | \
            sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
          if [[ "${#packaged_abis[@]}" -ne 1 || "${packaged_abis[0]}" != 'arm64-v8a' ]]; then
            printf 'Unexpected APK ABIs: %s\n' "${packaged_abis[*]}" >&2
            exit 1
          fi

          rm -rf android-project/app/build android-project/app/.cxx build

          cat > "$asset_dir/$package_name-BUILD-INFO.txt" <<EOF
          Yosuga no Sora: HD Remake
          Runtime: Android Kirikiri SDL2 (ARM64)
          Release: $RELEASE_TAG
          Commit: $GITHUB_SHA
          Signing: $SIGNING_MODE
          Native optimization: RelWithDebInfo -O3, NDEBUG, ARM64 NEON with fallback
          EOF

          echo "asset-directory=$asset_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$asset_dir"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          ASSET_DIRECTORY: ${{ steps.package.outputs.asset-directory }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("$ASSET_DIRECTORY"/*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo 'No release assets were found.' >&2
            exit 1
          fi

          notes=$(cat <<EOF
          Yosuga no Sora: HD Remake release packages.

          Install the APK directly; the game data is downloaded by the app
          on first launch (or imported from the data zips / data.xp3).


          Android signing mode: **$SIGNING_MODE**.
          EOF
          )

          release_exists=false
          release_is_draft=false
          if release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$GH_REPOSITORY" --json isDraft 2>/dev/null); then
            release_exists=true
            release_is_draft=$(python3 -c \
              'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' \
              <<<"$release_json")
          else
            create_args=(
              release create "$RELEASE_TAG"
              --repo "$GH_REPOSITORY"
              --draft
              --title "$RELEASE_TAG"
              --notes "$notes"
              --generate-notes
            )
            if [[ "$EVENT_NAME" == 'push' ]]; then
              create_args+=(--verify-tag)
            else
              create_args+=(--target "$COMMIT_SHA")
            fi
            if [[ "$IS_PRERELEASE" == 'true' ]]; then
              create_args+=(--prerelease)
            fi
            if ! gh "${create_args[@]}"; then
              for ((attempt = 1; attempt <= 12; attempt++)); do
                if release_json=$(gh release view "$RELEASE_TAG" \
                  --repo "$GH_REPOSITORY" --json isDraft 2>/dev/null); then
                  release_exists=true
                  release_is_draft=$(python3 -c \
                    'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' \
                    <<<"$release_json")
                  break
                fi
                echo "Waiting for another workflow to create the release ($attempt/12)."
                sleep 5
              done
              if [[ "$release_exists" != 'true' ]]; then
                echo 'GitHub Release creation failed.' >&2
                exit 1
              fi
            fi
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GH_REPOSITORY" --clobber

          if [[ "$release_exists" == 'false' || "$release_is_draft" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft=false
          fi
